<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Shared I2C bus: every device taps the SAME four wires</text>

  <!-- origin block -->
  <rect x="18" y="62" width="120" height="116" rx="6" fill="#eef2fb" stroke="#33558a" stroke-width="1.5"/>
  <text x="78" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">From logger</text>
  <text x="78" y="104" text-anchor="middle" font-size="11" fill="#222">A4 = SDA</text>
  <text x="78" y="120" text-anchor="middle" font-size="11" fill="#222">A5 = SCL</text>
  <text x="78" y="136" text-anchor="middle" font-size="11" fill="#222">+ VCC / GND</text>
  <text x="78" y="158" text-anchor="middle" font-size="9.5" fill="#555">(shared with the</text>
  <text x="78" y="170" text-anchor="middle" font-size="9.5" fill="#555">RTC module)</text>
  <text x="78" y="198" text-anchor="middle" font-size="9.5" fill="#555">already on bus:</text>
  <text x="78" y="210" text-anchor="middle" font-size="9.5" fill="#555">RTC 0x68 · 4k 0x57</text>

  <!-- vertical taps (drawn first, under rails) -->
  <g stroke="#999" stroke-width="2">
    <line x1="300" y1="70" x2="300" y2="232"/>
    <line x1="460" y1="70" x2="460" y2="232"/>
    <line x1="620" y1="70" x2="620" y2="232"/>
  </g>

  <!-- bus rails -->
  <g stroke-width="3">
    <line x1="138" y1="70"  x2="724" y2="70"  stroke="#c0392b"/>
    <line x1="138" y1="100" x2="724" y2="100" stroke="#333333"/>
    <line x1="138" y1="130" x2="724" y2="130" stroke="#2471a3"/>
    <line x1="138" y1="160" x2="724" y2="160" stroke="#1e8449"/>
  </g>

  <!-- rail labels (right side) -->
  <g font-size="11.5" font-weight="bold" text-anchor="start">
    <text x="730" y="74"  fill="#c0392b">VCC</text>
    <text x="730" y="104" fill="#333333">GND</text>
    <text x="730" y="134" fill="#2471a3">SDA</text>
    <text x="730" y="164" fill="#1e8449">SCL</text>
  </g>

  <!-- junction dots -->
  <g stroke="#ffffff" stroke-width="1">
    <circle cx="300" cy="70"  r="4" fill="#c0392b"/><circle cx="300" cy="100" r="4" fill="#333333"/><circle cx="300" cy="130" r="4" fill="#2471a3"/><circle cx="300" cy="160" r="4" fill="#1e8449"/>
    <circle cx="460" cy="70"  r="4" fill="#c0392b"/><circle cx="460" cy="100" r="4" fill="#333333"/><circle cx="460" cy="130" r="4" fill="#2471a3"/><circle cx="460" cy="160" r="4" fill="#1e8449"/>
    <circle cx="620" cy="70"  r="4" fill="#c0392b"/><circle cx="620" cy="100" r="4" fill="#333333"/><circle cx="620" cy="130" r="4" fill="#2471a3"/><circle cx="620" cy="160" r="4" fill="#1e8449"/>
  </g>

  <!-- module boxes -->
  <g>
    <rect x="240" y="234" width="120" height="58" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="300" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">BMP280</text>
    <text x="300" y="277" text-anchor="middle" font-size="11" fill="#333">0x76 · temp</text>

    <rect x="400" y="234" width="120" height="58" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="460" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">BH1750</text>
    <text x="460" y="277" text-anchor="middle" font-size="11" fill="#333">0x23 · light</text>

    <rect x="560" y="234" width="120" height="58" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="620" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">AT24C512</text>
    <text x="620" y="277" text-anchor="middle" font-size="11" fill="#333">0x50 · EEprom</text>
    <text x="620" y="226" text-anchor="middle" font-size="10" font-style="italic" fill="#777">64k · DEPLOY storage</text>
  </g>

  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#444">Each module's VCC·GND·SDA·SCL pins join the matching rail — wire the bus once and tap every device onto it.</text>
</svg>
